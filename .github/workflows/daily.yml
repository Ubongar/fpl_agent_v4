name: Daily FPL Ingest + Retrain

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply schema (idempotent)
        env:
          FPL_DATABASE_URL: ${{ secrets.FPL_DATABASE_URL }}
        run: psql "$FPL_DATABASE_URL" -f db/schema.sql

      - name: Ingest latest FPL data
        env:
          FPL_DATABASE_URL: ${{ secrets.FPL_DATABASE_URL }}
        run: python -m ingestion.fpl_source

      - name: Backfill per-GW history
        env:
          FPL_DATABASE_URL: ${{ secrets.FPL_DATABASE_URL }}
        run: python -m ingestion.historical_backfill

      - name: Compute player features
        env:
          FPL_DATABASE_URL: ${{ secrets.FPL_DATABASE_URL }}
        run: python -m ops.compute_player_features --gw 4

      - name: Train team strength
        env:
          FPL_DATABASE_URL: ${{ secrets.FPL_DATABASE_URL }}
        run: python -m models.train_team_strength --gw 3

      - name: Train expected minutes
        env:
          FPL_DATABASE_URL: ${{ secrets.FPL_DATABASE_URL }}
        run: python -m models.train_expected_minutes

      - name: Generate predictions for GW4
        env:
          FPL_DATABASE_URL: ${{ secrets.FPL_DATABASE_URL }}
        run: python -m models.run_predictions --gw 4